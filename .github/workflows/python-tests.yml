name: Python Tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: gcmpy pytest
    runs-on: ubuntu-slim
    timeout-minutes: 10
    defaults:
      run:
        working-directory: gcmpy
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: gcmpy/requirements-test.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Run pytest
        run: python -m pytest gcmpy_tests -q
