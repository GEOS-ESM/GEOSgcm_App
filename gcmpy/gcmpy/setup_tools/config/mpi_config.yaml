# Values are strings; "" sets an empty value and null removes a variable.
# Testing by Bill Putman determined useful Open MPI settings for NCCS/macOS.
openmpi:
  # Turn off warning about TMPDIR on NFS
  OMPI_MCA_shmem_mmap_enable_nfs_warning: "0"
  # Pre-connect MPI procs on mpi_init
  OMPI_MCA_mpi_preconnect_all: "1"
  OMPI_MCA_coll_tuned_bcast_algorithm: "7"
  OMPI_MCA_coll_tuned_scatter_algorithm: "2"
  OMPI_MCA_coll_tuned_reduce_scatter_algorithm: "3"
  OMPI_MCA_coll_tuned_allreduce_algorithm: "3"
  OMPI_MCA_coll_tuned_allgather_algorithm: "4"
  OMPI_MCA_coll_tuned_allgatherv_algorithm: "3"
  OMPI_MCA_coll_tuned_gather_algorithm: "1"
  OMPI_MCA_coll_tuned_barrier_algorithm: "0"
  # Required for a tuned flag to be effective
  OMPI_MCA_coll_tuned_use_dynamic_rules: "1"
  # Disable file locks (no shell quotes in the actual environment value)
  OMPI_MCA_sharedfp: "^lockedfile,individual"

mvapich:
  MV2_ENABLE_AFFINITY: "0"
  SLURM_DISTRIBUTION: "block"
  MV2_MPIRUN_TIMEOUT: "100"
  MV2_GATHERV_SSEND_THRESHOLD: "256"

mpich:
  # Testing on Athena/Turin at NAS shows these are needed for oserver use.
  # These should probably only be used by Cray MPICH at NAS, but for now
  # that is the only MPICH being used there.
  FI_CXI_OPTIMIZED_MRS: "0"
  FI_CXI_RX_MATCH_MODE: "hybrid"

mpt:
  MPI_COLL_REPRODUCIBLE: ""
  SLURM_DISTRIBUTION: "block"
  # MPI_DISPLAY_SETTINGS: "1"
  # MPI_VERBOSE: "1"
  MPI_MEMMAP_OFF: ""
  MPI_NUM_MEMORY_REGIONS: null
  MPI_XPMEM_ENABLED: "yes"
  SUPPRESS_XPMEM_TRIM_THRESH: null
  MPI_LAUNCH_TIMEOUT: "40"
  MPI_COMM_MAX: "1024"
  MPI_GROUP_MAX: "1024"
  MPI_BUFS_PER_PROC: "256"
  # PMI_RANK is sometimes inherited and interferes with binarytile.x
  # and other executables.
  PMI_RANK: null
  # Uncomment to expose Intel Fortran tracebacks otherwise absorbed by MPT.
  # FOR_IGNORE_EXCEPTIONS: "false"

intelmpi: {}
  # Uncomment to print Intel MPI state:
  # I_MPI_DEBUG: "9"

# Fabric/cluster-specific options useful at NCCS and NAS. These must not
# be enabled generally (for example, on CI runners).
intelmpi_NASA:
  I_MPI_ADJUST_ALLREDUCE: "12"
  I_MPI_ADJUST_GATHERV: "3"
  I_MPI_FABRICS: "shm:ofi"
  I_MPI_OFI_PROVIDER: "psm3"
  # Helps with congestion
  FI_PSM3_CONN_TIMEOUT: "120"
  # If -perhost/-ppn placement behaves oddly, uncomment this setting.
  # Usually needed interactively, not with SLURM/PBS in batch mode.
  # I_MPI_JOB_RESPECT_PROCESS_PLACEMENT: "disable"
