# Atmosphere catalog derived from atmosphere.py and geos_settings/horizontal_resolution.py
# Fields that are derived at runtime from AGCM_grid (im, jm, gridfile, res,
# gridname, res_dateline, hist_im, hist_jm) are stored here since they are
# formulaic from im (im = numeric part of AGCM_grid, e.g. c48 -> im=48).
# Only dt, lm, and microphysics are runtime-only (from expConfig).

