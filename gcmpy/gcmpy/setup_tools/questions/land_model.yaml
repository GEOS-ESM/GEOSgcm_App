LAND_bcs:
  type:           'select'
  prompt:         'Select the Land Surface Boundary Conditions:'
  choices:        ['v12', 'NL3', 'ICA']
  default_answer: ''
  follows_up:
    - ['OCEAN_data_atmosphere', [False]]
    - ['OCEAN_data_atmosphere', ['was_not_asked']]

LAND_model:
  type:           'select'
  prompt:         'Select the Land Surface Model:'
  choices:        ['Catchment', 'CatchmentCN-CLM4.0 (CN_CLM40)']
  default_answer: ''
  follows_up:
    - ['OCEAN_data_atmosphere', [False]]
    - ['OCEAN_data_atmosphere', ['was_not_asked']]
